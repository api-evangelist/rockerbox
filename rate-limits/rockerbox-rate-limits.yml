name: Rockerbox Rate Limits
description: Rockerbox does not publicly document specific API rate limits. The platform provides API spend integrations with major advertising platforms (Google Ads, Facebook, TikTok, Pinterest, LinkedIn, Snapchat, Bing, Criteo, and others) and a REST API for querying attribution data. Rate limit policies are likely communicated to customers as part of contract agreements. Contact Rockerbox support for specific rate limit details applicable to your account.
specificationVersion: '0.1'
rateLimits:
