description: >-
  Rockerbox publishes no rate limits. The entire Setup and Technical Documentation tree, the webhook
  ingestion reference, and the Data Foundation docs site (searched through the provider's own MCP
  server) contain no numeric limit, no window, no burst allowance, no throttling status code, and no
  rate-limit response header. An honest zero: this is a documented absence, not an unexamined gap.
rateLimits: []
response_headers:
  documented: []
  note: >-
    No X-RateLimit-*, RateLimit-* or Retry-After header is documented on any Rockerbox surface, so an
    agent has no runtime signal to back off on. The only documented throughput constraint is
    structural rather than numeric — the ingestion endpoint accepts exactly one conversion per POST
    ("Only one event / conversion should be included per POST request to Rockerbox"), which forces
    one request per event rather than capping requests per unit time.
exhaustion_status_code: null
structural_constraints:
- surface: https://webhooks.getrockerbox.com/webhook/data
  constraint: One event / conversion per POST request.
  source: https://help.rockerbox.com/article/5t050dmcxv-webhooks
- surface: Data Foundation docs MCP server
  constraint: Tool output truncated to 30KB per call (a payload cap, not a rate limit).
  source: mcp/rockerbox-mcp.yml
- surface: Snowflake Reader Account
  constraint: >-
    Rockerbox applies a monthly credit limit on provisioned reader accounts to cover egress costs. A
    consumption ceiling on the warehouse egress path; no figure is published.
  source: https://data-foundation.rockerbox.com/warehousing/snowflake-reader
