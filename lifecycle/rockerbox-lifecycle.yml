    breaking: true
    action_required_by: '2026-04-13'
    effective: '2026-04-13'
    affected: aggregate_mta.partition
    impact: >-
      Queries referencing aggregate_mta.partition fail after the effective date. Queries that do not
      reference it are unaffected.
    rationale: Improves data sync performance during long backfills.
    migration:
    - "Remove `partition` from SELECT statements."
    - "Avoid SELECT * — use an explicit column list so future schema changes do not break queries."
    - "Replace WHERE partition = 'mta' with WHERE even > 0."
    - "Replace WHERE partition = 'included_spend' with WHERE included_spend > 0."
