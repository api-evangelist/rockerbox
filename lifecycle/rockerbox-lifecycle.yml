    title: Aggregate MTA Migration Guide
    url: https://data-foundation.rockerbox.com/warehousing/aggregate-mta-migration-guide
    breaking: true
    affected: legacy Buckets Breakdown tables
    impact: >-
      Legacy Buckets Breakdown tables are superseded by aggregate_mta; the guide supplies view
      templates for the conversion.
