description: >-
  Rockerbox has no HTTP API version to deprecate — its contract is the warehouse schema. Lifecycle is
  therefore managed at the DATA layer, and Rockerbox does publish it there: dated, breaking schema
  changes with a required-action date, a stated impact, and a before/after migration table. That is a
  real deprecation communication and it is recorded as such. What Rockerbox does NOT publish is a
  standing deprecation POLICY, an SLA, or a public status page — each recorded honestly below.
