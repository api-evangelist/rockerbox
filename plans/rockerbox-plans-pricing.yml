description: >-
  As published on 2026-08-13, the Rockerbox plans page carries NO price. It presents a product mix —
  the Data Foundation products (Collect, Track, Export) plus the analysis methodologies (MTA, MMM,
  Incrementality Testing, Journey) — and a single "Talk to an Expert" call to action. Pricing is
  quote-based and gated behind sales.
history_note: >-
  Rockerbox previously ran two self-serve tiers and has retired both. The page source still contains
  the markup for a "Rockerbox Free" plan (no credit card, basic aggregation for Social and Search,
  Google Sheets templates, live spend trends dashboard) and a "Starter" plan (from $150/month, for
  Shopify brands under $1M ad spend, priced on a monthly ad-spend slider from <$10K to >$100K) — but
  both blocks are commented out in the HTML and therefore do not render. The linked landing pages
  confirm the retirement: /signup-free now 302s to /demo and /rockerbox-starter now 302s to /product.
  Recorded because the delta is the story; neither retired tier is counted in plan_count.
