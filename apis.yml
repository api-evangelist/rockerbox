x-coverage:
  state: covered
  reason: covered
  detail: >-
    Rockerbox publishes no OpenAPI, GraphQL or AsyncAPI — confirmed by probing /openapi.json,
    /openapi.yaml, /swagger.json, /v1/openapi.json, /api-docs, /docs and /redoc on every host and by
    enumerating the docs corpus through Rockerbox's own MCP server, which returned no spec file. That
    absence is a real finding, not a blocked run: the rest of the surface is public and machine-readable,
    and this pass harvested a live MCP server, an A2A agent card, a provider-published Agent Skill, an
    llms.txt, the documented webhook ingestion contract and the published warehouse schemas.
  evidence:
    - url: https://data-foundation.rockerbox.com/.well-known/agent-card.json
      status: 200
    - url: https://data-foundation.rockerbox.com/mcp
      status: 200
    - url: https://data-foundation.rockerbox.com/llms.txt
      status: 200
    - url: https://data-foundation.rockerbox.com/openapi.json
      status: 404
  checked: '2026-08-13'
x-corrections:
  - date: '2026-08-13'
    field: apis[0].baseURL / apis[0].properties[].url
    was: https://backend-prod-k8s.rockerbox.tech
    now: https://webhooks.getrockerbox.com
    reason: >-
      STEP 0c ownership failure caught and corrected. The previous profile pointed this repo's only
      API entry at backend-prod-k8s.rockerbox.tech, whose /docs route serves a Redocusaurus site whose
      embedded OpenAPI 3.0.1 is titled "RockerBox API v1.0" with servers[]
      https://backend-prod-k8s.rockerbox.tech/api and an auth spec at /auth/connect/token. That spec is
      REAL and it PARSES — and it belongs to a DIFFERENT COMPANY. rockerbox.tech is Rockerbox, the
      Texas tax-credit consultancy ("Rockerbox | Tax Credit Consultants | WOTC, ERTC, R&D, More"),
      unrelated to rockerbox.com, the New York marketing-attribution platform this repo profiles. The
      contaminated spec was NOT harvested and nothing was derived from it. The corrected entry points
      at the ingestion host Rockerbox's own help centre documents.
