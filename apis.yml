apis:
  - aid: rockerbox:rockerbox-api
    name: Rockerbox Conversion & Marketing Event Ingestion
    description: >-
      Rockerbox's server-side integration. A documented HTTP POST endpoint that accepts one conversion
      or marketing event per request as JSON, authenticated by a Rockerbox Advertiser ID passed in the
      query string and issued by an account manager. Used for events that happen off the customer's
      web property — in-store purchases, back-end funnel events, subscription lifecycle events. No
      OpenAPI is published for it.
    humanURL: https://help.rockerbox.com/article/5t050dmcxv-webhooks
    baseURL: https://webhooks.getrockerbox.com
    tags:
      - Conversion Tracking
      - Webhook
      - Marketing Data
    tags_raw:
      - Conversion Tracking
      - Webhooks
      - Marketing Data
    properties:
      - type: Documentation
        url: https://help.rockerbox.com/article/5t050dmcxv-webhooks
      - type: Webhooks
        url: asyncapi/rockerbox-webhooks.yml
      - type: Authentication
        url: authentication/rockerbox-authentication.yml
      - type: Conventions
        url: conventions/rockerbox-conventions.yml
  - aid: rockerbox:rockerbox-data-foundation
    name: Rockerbox Data Foundation
    description: >-
      Rockerbox's warehouse-share delivery surface and the documentation site that describes it. The
      contract here is a set of published dataset schemas — log_conversions, clickstream, log_mta,
      aggregate_mta, platform_* and taxonomy_lookup — shared natively into Snowflake, BigQuery or
      Redshift, with a provider-published entity-relationship diagram. This host also serves the
      remote MCP server, the A2A agent card, the Agent Skill and llms.txt.
    humanURL: https://data-foundation.rockerbox.com/
    baseURL: https://data-foundation.rockerbox.com
    tags:
