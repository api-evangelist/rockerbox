aid: rockerbox
name: Rockerbox
description: >-
  Rockerbox is a New York-based unified marketing measurement platform that combines multi-touch
  attribution (MTA), marketing mix modeling (MMM) and incrementality testing on a single first-party
  data foundation spanning 100+ advertising integrations. Its developer surface is deliberately
  narrow and unusual: there is no public REST API and no OpenAPI. Data goes IN through a documented
  server-side conversion webhook, onsite tracking pixels, and batch files; results come OUT as
  warehouse shares into Snowflake, BigQuery or Redshift against published schemas, plus scheduled and
  ad hoc exports. Rockerbox does, however, run a genuinely modern agent surface on its Data
  Foundation documentation host — an anonymous remote MCP server, an A2A agent card, a
  provider-published Agent Skill, an llms.txt, and an explicit robots.txt Content-Signal grant.
