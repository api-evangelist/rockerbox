description: >-
  Cross-cutting standards conformance for Rockerbox. Rockerbox publishes no OpenAPI, no OAuth/OIDC
  discovery and no RFC 9457 error envelope, so most of the usual API standards resolve to
  conforms:false with the probe that established it. Where Rockerbox DOES publish a compliance
  posture — SOC 2, and a privacy programme covering GDPR/CCPA/CPRA and Privacy Shield — it is
  recorded with the page that states it. Nothing is asserted that a probe or a provider page did not
  establish.
standards:
- id: soc2
  conforms: true
  evidence: >-
    "Rockerbox adheres to SOC2 standards, which are rigorous criteria for managing customer data
    based on five trust service principles — security, availability, processing integrity,
    confidentiality, and privacy."
  source: https://www.rockerbox.com/faq/how-does-rockerbox-provide-secure-marketing-measurement
  caveat: >-
    A published claim, not a verified report. No trust centre, no attestation date, no auditor named,
    and no Type I / Type II distinction is given. Rockerbox does not operate a trust portal.
- id: gdpr
  conforms: true
  evidence: Dedicated GDPR guidance plus a privacy policy naming privacy@rockerbox.com as the data contact.
  source: https://help.rockerbox.com/article/38eojazpyn-gdpr
- id: ccpa-cpra
  conforms: true
  evidence: Privacy (GDPR, CCPA, CPRA) documentation and a documented data retrieval/deletion process.
  source: https://help.rockerbox.com/article/z61hegm7yg-data-retrieval-deletion
- id: privacy-shield
  conforms: true
  evidence: Rockerbox maintains a Privacy Shield page on its own site.
  source: https://www.rockerbox.com/privacy-shield
  caveat: The EU-US Privacy Shield framework was invalidated in 2020; the page is recorded as published, not as currently sufficient.
